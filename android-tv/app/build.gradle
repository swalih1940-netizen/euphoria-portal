plugins {
    id 'com.android.application'
}

android {
    namespace 'com.euphoria.tv'
    compileSdk 34
    buildToolsVersion "34.0.0"

    defaultConfig {
        applicationId "com.euphoria.tv"
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
}

tasks.register('copyApkToLocal') {
    doLast {
        def srcApk = file("${layout.buildDirectory.get()}/outputs/apk/debug/app-debug.apk")
        def destFile = file("${projectDir}/build/outputs/apk/debug/app-debug.apk")
        if (srcApk.exists()) {
            boolean isSame = false
            try {
                if (destFile.exists()) {
                    isSame = (srcApk.toPath().toRealPath().equals(destFile.toPath().toRealPath()))
                } else if (file("${projectDir}/build").exists()) {
                    isSame = file("${layout.buildDirectory.get()}").toPath().toRealPath().equals(file("${projectDir}/build").toPath().toRealPath())
                }
            } catch (Exception ignored) {}

            if (isSame) {
                println "Debug APK is directly available at ${destFile.absolutePath}"
            } else {
                destFile.parentFile.mkdirs()
                java.nio.file.Files.copy(srcApk.toPath(), destFile.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                println "Copied debug APK to ${destFile.absolutePath}"
            }
        }
    }
}

afterEvaluate {
    tasks.named('assembleDebug').configure {
        finalizedBy('copyApkToLocal')
    }
}